# The declared project version. A release tag must name exactly this version; see
# gradle/verify-release-preconditions.sh and docs/releasing.md.
foundryVersion=0.1.0
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.java.installations.auto-detect=true
# AGP 9 applies Kotlin to every Android module by default, which puts kotlin-stdlib on
# foundry-java-android's api and therefore into its published POM. The Android binding is
# Java-first and Kotlin must not become a required ABI, so built-in Kotlin stays off; the
# module has no Kotlin sources. verifyPublications fails if the stdlib reappears.
android.builtInKotlin=false
android.nonTransitiveRClass=true
android.useAndroidX=true
