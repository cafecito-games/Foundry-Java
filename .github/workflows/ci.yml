name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            tools platform-tools platforms;android-36 build-tools;35.0.0
            ndk;29.0.14206865 cmake;3.22.1
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # gradle.properties has set org.gradle.caching=true all along, but nothing persisted
      # ~/.gradle between runs, so the build cache was enabled and then discarded every run: the full
      # dependency graph was re-resolved and no task output was ever reused. This restores both the
      # dependency cache and the build cache. Writes are limited to the default branch by default, so
      # pull requests read main's cache without polluting it.
      #
      # This does not weaken the reuse proof below. The build cache lives in
      # ~/.gradle/caches/build-cache-1 and the configuration cache lives in the project's
      # .gradle/configuration-cache, which is not cached here and which the proof deletes anyway.
      # Restoring task outputs is not what either of the proof's runs is asserting.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          validate-wrappers: false
      - name: Prove configuration cache reuse from clean outputs
        shell: bash
        run: bash gradle/verify-configuration-cache-reuse.sh
      - name: Prove the configuration cache gate still fails what it exists to catch
        shell: bash
        run: bash gradle/verify-configuration-cache-reuse-selftest.sh
      - name: Build, test, and inspect the native bridge
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :foundry-java-android:assembleDebug \
            :foundry-java-android:assembleDebugAndroidTest \
            :foundry-java-android:bundleReleaseAar \
            :foundry-java-android:nativeHostTest \
            :foundry-java-android:nativeSanitizerTest 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-check.log"
          bash gradle/verify-native-bridge.sh \
            foundry-java-android/build/outputs/aar/foundry-java-android-release.aar 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-native-verifier.log"
      - run: ./gradlew --write-locks resolveAndLockAll
      - name: Verify dependency locks are unchanged
        shell: bash
        run: |
          lock_status="$(
            git status --porcelain --untracked-files=all -- \
              gradle.lockfile \
              ':(glob)**/gradle.lockfile' \
              settings-gradle.lockfile
          )"
          if [[ -n "$lock_status" ]]; then
            printf '%s\n' "$lock_status"
            exit 1
          fi
      - name: Upload build and native verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-check-evidence
          if-no-files-found: warn
          path: |
            **/build/reports/**
            foundry-java-runtime/build/reports/foundry-realization/**
            foundry-java-android/build/native-host/**
            foundry-java-android/build/native-host-sanitized/**
            foundry-java-android/build/outputs/aar/**
            foundry-java-android/build/intermediates/merged_manifest/**
            ${{ runner.temp }}/foundry-java-check.log
            ${{ runner.temp }}/foundry-java-native-verifier.log
            ${{ runner.temp }}/foundry-java-configuration-cache-*.log

  device:
    name: JNI lifecycle on API 36
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FOUNDRY_ENGINE_CACHE: ${{ github.workspace }}/.foundry-engine-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            tools platform-tools emulator platforms;android-36 build-tools;35.0.0
            ndk;29.0.14206865 cmake;3.22.1
            system-images;android-36;default;x86_64
      # This job builds the same modules the check job does and had no Gradle cache either. It reads
      # the cache rather than writing it, so the two jobs cannot race to publish an entry.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          validate-wrappers: false
          cache-read-only: true
      - name: Create and launch the API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name foundry-java-acceptance \
            --package "system-images;android-36;default;x86_64"
          nohup "${ANDROID_HOME}/emulator/emulator" \
            -avd foundry-java-acceptance \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/foundry-java-emulator.log" 2>&1 &
      - name: Wait for observable emulator boot
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/platform-tools/adb" start-server
          attempt=1
          while test "${attempt}" -le 180; do
            if test "$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              "${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 devices -l
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          "${ANDROID_HOME}/platform-tools/adb" devices -l
          exit 1
      - name: Run production startup twice in fresh processes
        shell: bash
        run: bash gradle/run-android-production-startup-acceptance.sh emulator-5554
      - name: Run the Java and Kotlin conformance matrix as consumer samples
        shell: bash
        run: bash gradle/run-samples-conformance-matrix.sh emulator-5554
      # The pinned export template archive is roughly 1.1 GB, so it is cached by release tag and
      # asset digest. The key can never survive a pin bump, and gradle/fetch-pinned-engine.sh still
      # verifies every digest before use, so a cache hit is never treated as evidence of integrity.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.FOUNDRY_ENGINE_CACHE }}
          key: >-
            foundry-engine-v0.1.0-alpha.14-6a5cc2bb5b8b4cc7f48bcdf51575645fca408ac62e25dad0691d71f3a117a03f
      - name: Run the engine-loaded API 36 conformance gate
        shell: bash
        run: bash gradle/run-engine-loaded-conformance-gate.sh emulator-5554
      - name: Upload API 36 production startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-api36-production-startup-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/foundry-java-production-startup/**
            ${{ runner.temp }}/foundry-java-emulator.log
            foundry-java-android/build/outputs/apk/androidTest/debug/**
            foundry-java-android/build/intermediates/merged_manifest/debug/**
            foundry-java-android/build/intermediates/packaged_manifests/debugAndroidTest/**
            foundry-java-android/build/outputs/androidTest-results/**
            foundry-java-android/build/reports/androidTests/**
            ${{ runner.temp }}/foundry-java-conformance-matrix/**
            samples/*/build/reports/**
            samples/*/build/test-results/**
            samples/*/build/outputs/androidTest-results/**
            ${{ runner.temp }}/foundry-java-engine-gate/**
            acceptance/*/build/reports/**
