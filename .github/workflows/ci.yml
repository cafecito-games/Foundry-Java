name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon clean check
      - run: ./gradlew --no-daemon dependencies --write-locks
      - run: git diff --exit-code -- '**/gradle.lockfile' settings-gradle.lockfile
