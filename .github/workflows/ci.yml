name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew --no-daemon clean check --configuration-cache --configuration-cache-problems=fail
      - name: Prove configuration cache reuse
        shell: bash
        run: |
          set -o pipefail
          cache_log="$RUNNER_TEMP/configuration-cache-reuse.log"
          ./gradlew --no-daemon clean check --configuration-cache --configuration-cache-problems=fail \
            2>&1 | tee "$cache_log"
          grep -Eq 'Configuration cache entry reused|Reusing configuration cache' "$cache_log"
      - run: ./gradlew --write-locks resolveAndLockAll
      - name: Verify dependency locks are unchanged
        shell: bash
        run: |
          lock_status="$(
            git status --porcelain --untracked-files=all -- \
              gradle.lockfile \
              ':(glob)**/gradle.lockfile' \
              settings-gradle.lockfile
          )"
          if [[ -n "$lock_status" ]]; then
            printf '%s\n' "$lock_status"
            exit 1
          fi
