name: Shared gates

on:
  workflow_call:
    inputs:
      release:
        description: Run the release-strength host gate and release preconditions.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Whether a manually dispatched release is a staging dry run.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  host-gate:
    name: ${{ inputs.release && 'Host gate' || 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.release && 60 || 30 }}
    steps:
      # A manual dispatch can only ever prove the pipeline against a staging target, so a dispatch
      # that opts out of the dry run would run every gate and then do nothing. Refuse it up front
      # rather than reporting success for a run that released nothing.
      - name: Refuse a manual dispatch that is not a dry run
        if: inputs.release && github.event_name == 'workflow_dispatch' && !inputs.dry_run
        shell: bash
        run: |
          printf 'A manual dispatch only proves the pipeline against a staging target.\n' >&2
          printf 'A real release is a tag push. Re-run the dispatch with dry_run enabled.\n' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.release && '0' || '1' }}
      # AGP 9's lint calls java.util.List.removeLast(), a Java 21 API, so the Gradle JVM must be 21
      # or newer. Every toolchain, source and target level and published class file stays at 17;
      # gradle/gradle-daemon-jvm.properties states the same requirement for a local ./gradlew.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            tools platform-tools platforms;android-36 build-tools;36.0.0
            ndk;29.0.14206865 cmake;3.22.1
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # gradle.properties has set org.gradle.caching=true all along, but nothing persisted
      # ~/.gradle between runs, so the build cache was enabled and then discarded every run: the full
      # dependency graph was re-resolved and no task output was ever reused. This restores both the
      # dependency cache and the build cache. Writes are limited to the default branch by default, so
      # pull requests read main's cache without polluting it.
      #
      # This does not weaken the reuse proof below. The build cache lives in
      # ~/.gradle/caches/build-cache-1 and the configuration cache lives in the project's
      # .gradle/configuration-cache, which is not cached here and which the proof deletes anyway.
      # Restoring task outputs is not what either of the proof's runs is asserting.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: ${{ !inputs.release }}
        with:
          validate-wrappers: false
      - name: Prove configuration cache reuse from clean outputs
        shell: bash
        run: bash gradle/verify-configuration-cache-reuse.sh
      - name: Prove the configuration cache gate still fails what it exists to catch
        if: ${{ !inputs.release }}
        shell: bash
        run: bash gradle/verify-configuration-cache-reuse-selftest.sh
      # The configuration cache proof above cannot see this: an entry whose key embeds the checkout
      # path stores and reads back perfectly within one checkout, and only ever misses on another
      # machine. Nothing reports that, so it is asserted directly.
      - name: Prove verifier task cache entries are replayable at another checkout path
        shell: bash
        run: bash gradle/verify-build-cache-portability.sh
      - name: Prove the build cache portability gate still fails what it exists to catch
        if: ${{ !inputs.release }}
        shell: bash
        run: bash gradle/verify-build-cache-portability-selftest.sh
      - name: Build, test, and inspect the native bridge
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :foundry-java-android:assembleDebug \
            :foundry-java-android:assembleDebugAndroidTest \
            :foundry-java-android:bundleReleaseAar \
            :foundry-java-android:nativeHostTest \
            :foundry-java-android:nativeSanitizerTest 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-check.log"
          bash gradle/verify-native-bridge.sh \
            foundry-java-android/build/outputs/aar/foundry-java-android-release.aar 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-native-verifier.log"
      - if: ${{ !inputs.release }}
        run: ./gradlew --write-locks resolveAndLockAll
      - name: Verify dependency locks are unchanged
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          lock_status="$(
            git status --porcelain --untracked-files=all -- \
              gradle.lockfile \
              ':(glob)**/gradle.lockfile' \
              settings-gradle.lockfile
          )"
          if [[ -n "$lock_status" ]]; then
            printf '%s\n' "$lock_status"
            exit 1
          fi
      - name: Build, test, and inspect the native bridge
        if: inputs.release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :foundry-java-runtime:verifyRuntimeApi \
            :foundry-java-runtime:verifyGeneratedRealization \
            :foundry-java-android:assembleDebug \
            :foundry-java-android:assembleDebugAndroidTest \
            :foundry-java-android:bundleReleaseAar \
            :foundry-java-android:nativeAbiLayoutTest \
            :foundry-java-android:nativeHostTest \
            :foundry-java-android:nativeSanitizerTest 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-release-check.log"
          bash gradle/verify-native-bridge.sh \
            foundry-java-android/build/outputs/aar/foundry-java-android-release.aar 2>&1 |
            tee "${RUNNER_TEMP}/foundry-java-release-native-verifier.log"
      - name: Verify the release preconditions with regenerated dependency locks
        if: inputs.release && github.event_name == 'push'
        shell: bash
        env:
          FOUNDRY_RELEASE_VERIFY_LOCKS: regenerate
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-locks resolveAndLockAll
          bash gradle/verify-release-preconditions.sh "${GITHUB_REF_NAME}"
      - name: Regenerate dependency locks and reject drift
        if: inputs.release && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-locks resolveAndLockAll
          lock_status="$(
            git status --porcelain --untracked-files=all -- \
              gradle.lockfile \
              ':(glob)**/gradle.lockfile' \
              settings-gradle.lockfile
          )"
          if [[ -n "$lock_status" ]]; then
            printf '%s\n' "$lock_status"
            exit 1
          fi
      - name: Upload build and native verification evidence
        if: ${{ always() && !inputs.release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-check-evidence
          if-no-files-found: warn
          path: |
            **/build/reports/**
            foundry-java-runtime/build/reports/foundry-realization/**
            foundry-java-android/build/native-host/**
            foundry-java-android/build/native-host-sanitized/**
            foundry-java-android/build/outputs/aar/**
            foundry-java-android/build/intermediates/merged_manifest/**
            ${{ runner.temp }}/foundry-java-check.log
            ${{ runner.temp }}/foundry-java-native-verifier.log
            ${{ runner.temp }}/foundry-java-configuration-cache-*.log
      - name: Upload host gate evidence
        if: always() && inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-release-host-gate-evidence
          if-no-files-found: warn
          path: |
            **/build/reports/**
            foundry-java-runtime/build/reports/foundry-realization/**
            foundry-java-android/build/native-host/**
            foundry-java-android/build/native-host-sanitized/**
            foundry-java-android/build/outputs/aar/**
            ${{ runner.temp }}/foundry-java-release-check.log
            ${{ runner.temp }}/foundry-java-release-native-verifier.log

  device-gate:
    name: ${{ inputs.release && 'Device gate on API 36' || 'JNI lifecycle on API 36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FOUNDRY_ENGINE_CACHE: ${{ github.workspace }}/.foundry-engine-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify whether this change needs the engine-loaded gate
        id: engine-gate-scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          select_gate() {
            local run="$1"
            local reason="$2"
            printf 'run=%s\nreason=%s\n' "$run" "$reason" >> "$GITHUB_OUTPUT"
            printf 'Engine-loaded gate decision: run=%s reason=%s\n' "$run" "$reason"
          }

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            select_gate true non-pull-request
            exit 0
          fi

          if ! before_snapshot="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq 'if (.head.sha | type) == "string" and
                (.base.sha | type) == "string" and
                (.head.sha | length) > 0 and
                (.base.sha | length) > 0
                then [.head.sha, .base.sha] | @tsv
                else error("invalid pull request metadata")
                end' 2>/dev/null
          )"; then
            select_gate true classification-failed
            exit 0
          fi
          before_head=""
          before_base=""
          IFS=$'\t' read -r before_head before_base <<< "$before_snapshot"
          if [[ "$before_head" != "$EXPECTED_HEAD_SHA" ||
            "$before_base" != "$EXPECTED_BASE_SHA" ]]; then
            select_gate true classification-failed
            exit 0
          fi

          if ! pages="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" 2>/dev/null
          )"; then
            select_gate true classification-failed
            exit 0
          fi

          if ! after_snapshot="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq 'if (.head.sha | type) == "string" and
                (.base.sha | type) == "string" and
                (.head.sha | length) > 0 and
                (.base.sha | length) > 0
                then [.head.sha, .base.sha] | @tsv
                else error("invalid pull request metadata")
                end' 2>/dev/null
          )"; then
            select_gate true classification-failed
            exit 0
          fi
          after_head=""
          after_base=""
          IFS=$'\t' read -r after_head after_base <<< "$after_snapshot"
          if [[ "$after_head" != "$EXPECTED_HEAD_SHA" ||
            "$after_base" != "$EXPECTED_BASE_SHA" ||
            "$after_head" != "$before_head" ||
            "$after_base" != "$before_base" ]]; then
            select_gate true classification-failed
            exit 0
          fi

          set +e
          paths="$(
            printf '%s' "$pages" |
              bash gradle/extract-engine-gate-paths.sh "$EXPECTED_CHANGED_FILES" 2>/dev/null
          )"
          extract_status="$?"
          set -e
          case "$extract_status" in
            0)
              ;;
            2)
              select_gate true classification-incomplete
              exit 0
              ;;
            *)
              select_gate true classification-failed
              exit 0
              ;;
          esac
          if ! decision="$(
            printf '%s' "$paths" |
              bash gradle/classify-engine-gate-paths.sh 2>/dev/null
          )"; then
            select_gate true classification-failed
            exit 0
          fi

          case "$decision" in
            $'run=false\nreason=safe-only')
              select_gate false safe-only
              ;;
            $'run=true\nreason=relevant')
              select_gate true relevant
              ;;
            $'run=true\nreason=fail-closed')
              select_gate true fail-closed
              ;;
            *)
              select_gate true classification-failed
              ;;
          esac
      # AGP 9's lint calls java.util.List.removeLast(), a Java 21 API, so the Gradle JVM must be 21
      # or newer. Every toolchain, source and target level and published class file stays at 17;
      # gradle/gradle-daemon-jvm.properties states the same requirement for a local ./gradlew.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            tools platform-tools emulator platforms;android-36 build-tools;36.0.0
            ndk;29.0.14206865 cmake;3.22.1
            system-images;android-36;default;x86_64
      # This job builds the same modules the check job does and had no Gradle cache either. It reads
      # the cache rather than writing it, so the two jobs cannot race to publish an entry.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: ${{ !inputs.release }}
        with:
          validate-wrappers: false
          cache-read-only: true
      - name: Create and launch the API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          mkdir -p "${ANDROID_AVD_HOME}"
          avd_name="${{ inputs.release && 'foundry-java-release' || 'foundry-java-acceptance' }}"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name "${avd_name}" \
            --package "system-images;android-36;default;x86_64"
          nohup "${ANDROID_HOME}/emulator/emulator" \
            -avd "${avd_name}" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/foundry-java-emulator.log" 2>&1 &
      - name: Wait for observable emulator boot
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/platform-tools/adb" start-server
          attempt=1
          while test "${attempt}" -le 180; do
            if test "$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              "${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 devices -l
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          "${ANDROID_HOME}/platform-tools/adb" devices -l
          exit 1
      - name: Run production startup twice in fresh processes
        shell: bash
        run: bash gradle/run-android-production-startup-acceptance.sh emulator-5554
      - name: Run the Java and Kotlin conformance matrix as consumer samples
        shell: bash
        run: bash gradle/run-samples-conformance-matrix.sh emulator-5554
      # The pinned export template archive is roughly 1.1 GB, so it is cached by release tag and
      # asset digest. The key can never survive a pin bump, and gradle/fetch-pinned-engine.sh still
      # verifies every digest before use, so a cache hit is never treated as evidence of integrity.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.FOUNDRY_ENGINE_CACHE }}
          key: >-
            foundry-engine-v0.1.0-alpha.14-6a5cc2bb5b8b4cc7f48bcdf51575645fca408ac62e25dad0691d71f3a117a03f
      - name: Run the engine-loaded API 36 conformance gate
        if: steps.engine-gate-scope.outputs.run == 'true'
        shell: bash
        run: bash gradle/run-engine-loaded-conformance-gate.sh emulator-5554
      - name: Upload API 36 production startup evidence
        if: ${{ always() && !inputs.release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-api36-production-startup-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/foundry-java-production-startup/**
            ${{ runner.temp }}/foundry-java-emulator.log
            foundry-java-android/build/outputs/apk/androidTest/debug/**
            foundry-java-android/build/intermediates/merged_manifest/debug/**
            foundry-java-android/build/intermediates/packaged_manifests/debugAndroidTest/**
            foundry-java-android/build/outputs/androidTest-results/**
            foundry-java-android/build/reports/androidTests/**
            ${{ runner.temp }}/foundry-java-conformance-matrix/**
            samples/*/build/reports/**
            samples/*/build/test-results/**
            samples/*/build/outputs/androidTest-results/**
            ${{ runner.temp }}/foundry-java-engine-gate/**
            acceptance/*/build/reports/**
      - name: Upload device gate evidence
        if: always() && inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-java-release-device-gate-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/foundry-java-production-startup/**
            ${{ runner.temp }}/foundry-java-conformance-matrix/**
            ${{ runner.temp }}/foundry-java-engine-gate/**
            ${{ runner.temp }}/foundry-java-emulator.log
            samples/*/build/reports/**
            acceptance/*/build/reports/**
